version: '3.4'

services:
  backup:
    image: ttionya/vaultwarden-backup:latest
    restart: always
    environment:
      RCLONE_CONFIG_PASS: "${RCLONE_CONFIG_PASS}"
      MAIL_SMTP_VARIABLES: "${MAIL_SMTP_STARTTLS} -S smtp=${MAIL_SMTP_PROTOCOL}://${MAIL_SMTP_HOST}:${MAIL_SMTP_PORT} -S smtp-auth=${MAIL_SMTP_AUTH} -S smtp-auth-user=${MAIL_SMTP_USER} -S smtp-auth-password=${MAIL_SMTP_PASSWORD} -S from=${MAIL_SMTP_FROM}"
    volumes:
      - ${VAULTWARDEN_DATA_DIR}:/bitwarden/data/
      - ${RCLONE_CONFIG_DIR}:/config/
      - ./.env:/.env:ro
